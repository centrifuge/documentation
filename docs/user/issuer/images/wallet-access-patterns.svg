<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="white"/>
  <text x="40" y="46" font-size="19" fill="#6b7280">Recommended issuer wallet access patterns</text>

  <!-- Hub administration wallet -->
  <rect x="40" y="75" width="330" height="110" rx="12" fill="#fff8e6" stroke="#ffc012" stroke-width="2"/>
  <text x="62" y="113" font-size="20" font-weight="bold" fill="#1f2630">Hub administration wallet</text>
  <text x="62" y="141" font-size="15" fill="#6b7280">MPC or multisig custody</text>
  <text x="62" y="165" font-size="15" fill="#6b7280">multiple approvers</text>

  <!-- Hub operations wallet or policy -->
  <rect x="40" y="215" width="330" height="110" rx="12" fill="#fff8e6" stroke="#ffc012" stroke-width="2"/>
  <text x="62" y="253" font-size="20" font-weight="bold" fill="#1f2630">Hub operations wallet / policy</text>
  <text x="62" y="281" font-size="15" fill="#6b7280">separate wallet or MPC policy</text>
  <text x="62" y="305" font-size="15" fill="#6b7280">routine Hub operations</text>

  <!-- Balance sheet manager wallet -->
  <rect x="40" y="375" width="330" height="110" rx="12" fill="#fff8e6" stroke="#ffc012" stroke-width="2"/>
  <text x="62" y="413" font-size="20" font-weight="bold" fill="#1f2630">Balance sheet manager wallet</text>
  <text x="62" y="441" font-size="15" fill="#6b7280">operational wallet</text>
  <text x="62" y="465" font-size="15" fill="#6b7280">scoped per network</text>

  <!-- Operator wallet -->
  <rect x="40" y="525" width="330" height="110" rx="12" fill="#fff8e6" stroke="#ffc012" stroke-width="2"/>
  <text x="62" y="563" font-size="20" font-weight="bold" fill="#1f2630">Operator wallet</text>
  <text x="62" y="591" font-size="15" fill="#6b7280">Onchain PM operator</text>
  <text x="62" y="615" font-size="15" fill="#6b7280">workflow execution only</text>

  <!-- Hub -->
  <rect x="780" y="65" width="380" height="270" rx="12" fill="#1f2630"/>
  <text x="802" y="108" font-size="26" font-weight="bold" fill="#ffffff">Hub</text>
  <text x="1138" y="108" font-size="14" fill="#9ca3af" text-anchor="end">hub chain</text>
  <text x="802" y="136" font-size="16" fill="#ffc012">Controls and accounting</text>
  <line x1="802" y1="157" x2="1138" y2="157" stroke="#4b5563" stroke-width="1"/>
  <text x="802" y="188" font-size="15" font-weight="bold" fill="#ffffff">Administration</text>
  <text x="802" y="216" font-size="16" fill="#d1d5db">•  Roles, permissions, tokens and managers</text>
  <text x="802" y="259" font-size="15" font-weight="bold" fill="#ffffff">Operations</text>
  <text x="802" y="287" font-size="16" fill="#d1d5db">•  Pricing and order processing</text>

  <!-- Spoke -->
  <rect x="780" y="385" width="380" height="250" rx="12" fill="#ffffff" stroke="#cbd0d8" stroke-width="2"/>
  <text x="802" y="428" font-size="26" font-weight="bold" fill="#1f2630">Spoke</text>
  <text x="1138" y="428" font-size="14" fill="#9aa0aa" text-anchor="end">each operating network</text>
  <text x="802" y="456" font-size="16" fill="#6b7280">Distribution and balance sheet</text>
  <text x="802" y="496" font-size="16" fill="#4b5563">•  Balance sheet deposits and withdrawals</text>
  <text x="802" y="528" font-size="16" fill="#4b5563">•  Optional on/off-ramps</text>
  <text x="802" y="560" font-size="16" fill="#4b5563">•  Workflow execution (Onchain PM)</text>

  <!-- Access paths -->
  <path d="M 374 130 L 772 180" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="573" y="140" font-size="15" fill="#6b7280" text-anchor="middle">administers pool configuration</text>

  <path d="M 374 270 L 772 270" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="573" y="256" font-size="15" fill="#6b7280" text-anchor="middle">runs routine Hub operations</text>

  <path d="M 374 430 C 545 430, 620 478, 772 490" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="565" y="417" font-size="15" fill="#6b7280" text-anchor="middle">moves balance sheet assets, per network</text>

  <path d="M 374 580 L 772 555" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="573" y="558" font-size="15" fill="#6b7280" text-anchor="middle">runs pre-approved workflows</text>
</svg>

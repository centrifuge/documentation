<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="white"/>
  <text x="600" y="42" font-size="19" fill="#6b7280" text-anchor="middle">One product, three roles</text>

  <!-- Issuer -->
  <rect x="60" y="60" width="290" height="110" rx="12" fill="#fff8e6" stroke="#ffc012" stroke-width="2"/>
  <text x="82" y="100" font-size="22" font-weight="bold" fill="#1f2630">Issuer</text>
  <text x="82" y="128" font-size="15" fill="#6b7280">operates the product</text>
  <text x="82" y="152" font-size="15" fill="#6b7280">Management app</text>

  <!-- Curator -->
  <rect x="850" y="60" width="290" height="110" rx="12" fill="#fff8e6" stroke="#ffc012" stroke-width="2"/>
  <text x="872" y="100" font-size="22" font-weight="bold" fill="#1f2630">Curator</text>
  <text x="872" y="128" font-size="15" fill="#6b7280">acts as portfolio manager</text>
  <text x="872" y="152" font-size="15" fill="#6b7280">through Onchain PM</text>

  <!-- Investor -->
  <rect x="60" y="450" width="290" height="110" rx="12" fill="#fff8e6" stroke="#ffc012" stroke-width="2"/>
  <text x="82" y="490" font-size="22" font-weight="bold" fill="#1f2630">Investor</text>
  <text x="82" y="518" font-size="15" fill="#6b7280">invests from their own wallet</text>
  <text x="82" y="542" font-size="15" fill="#6b7280">Investment app</text>

  <!-- Onchain venues -->
  <rect x="850" y="450" width="290" height="110" rx="12" fill="#ffffff" stroke="#cbd0d8" stroke-width="2"/>
  <text x="872" y="490" font-size="22" font-weight="bold" fill="#1f2630">Onchain venues</text>
  <text x="872" y="518" font-size="15" fill="#6b7280">other tokenized products,</text>
  <text x="872" y="542" font-size="15" fill="#6b7280">DeFi protocols, other networks</text>

  <!-- Pool -->
  <rect x="460" y="240" width="280" height="150" rx="12" fill="#1f2630"/>
  <text x="482" y="283" font-size="24" font-weight="bold" fill="#ffffff">Pool</text>
  <text x="482" y="311" font-size="15" fill="#ffc012">the product onchain</text>
  <text x="482" y="343" font-size="15" fill="#d1d5db">•  balance sheet and share tokens</text>
  <text x="482" y="369" font-size="15" fill="#d1d5db">•  vaults as entry points</text>

  <!-- Issuer -> Pool -->
  <path d="M 350 115 C 430 115, 470 165, 507 236" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="468" y="100" font-size="15" fill="#6b7280" text-anchor="middle">investor access, pricing, orders</text>

  <!-- Curator -> Pool -->
  <path d="M 850 115 C 770 115, 730 165, 693 236" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="748" y="100" font-size="15" fill="#6b7280" text-anchor="middle">allocates the pool's capital</text>

  <!-- Investor <-> Pool -->
  <path d="M 350 505 C 430 505, 470 458, 507 394" fill="none" stroke="#6b7280" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="480" y="528" font-size="15" fill="#6b7280" text-anchor="middle">invests and redeems through vaults</text>

  <!-- Pool <-> Venues -->
  <path d="M 693 394 C 730 458, 770 505, 850 505" fill="none" stroke="#6b7280" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="742" y="528" font-size="15" fill="#6b7280" text-anchor="middle">capital and returns</text>
</svg>
